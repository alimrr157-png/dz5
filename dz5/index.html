<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интерактивный калькулятор</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        .calculator {
            max-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input {
            padding: 8px;
            font-size: 16px;
        }
        .buttons {
            display: flex;
            gap: 5px;
        }
        .operation-btn {
            flex: 1;
            padding: 10px;
            font-size: 18px;
            cursor: pointer;
        }
        #result {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="number" id="num1" placeholder="Первое число">
        <input type="number" id="num2" placeholder="Второе число">
        
        <div class="buttons">
            <button class="operation-btn" data-op="+">+</button>
            <button class="operation-btn" data-op="-">-</button>
            <button class="operation-btn" data-op="*">×</button>
            <button class="operation-btn" data-op="/">÷</button>
        </div>

        <div id="result">Результат: </div>
    </div>

    <!-- Подключаем скрипт -->
    <script src="script.js"></script>
</body>
</html>
